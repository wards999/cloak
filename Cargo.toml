[package]
name = "cloak"
version = "0.1.0"
edition = "2021"
description = "A name-mapping overlay filesystem with header/footer encryption. Obfuscation layer, not a security guarantee."

[dependencies]
# Seekable stream cipher: ChaCha20 lets us encrypt an arbitrary contiguous
# region (the header and footer) by seeking the keystream to a byte offset.
chacha20 = "0.9.1"
# Per-file nonce + master-key handling.
rand = "0.8.5"
# The lookup index (scrambled <-> original name, plus per-file crypto params).
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# Passphrase -> master key (Argon2id), so the key is derived, never stored.
argon2 = "0.5.3"

[dev-dependencies]
tempfile = "3.10.1"

# The mount adapter is an optional binary so the core engine builds and tests
# everywhere, even without a FUSE/WinFsp driver installed.
[[bin]]
name = "cloak-mount"
path = "src/bin/mount.rs"
required-features = ["mount"]

# Windows live mount via WinFsp. Needs the WinFsp runtime installed and LLVM
# (libclang) for the binding generation in winfsp-sys.
[[bin]]
name = "cloak-winmount"
path = "src/bin/winmount.rs"
required-features = ["winfsp"]

[features]
default = []
mount = ["dep:fuser"]
winfsp = ["dep:winfsp", "dep:winfsp-sys"]

[target.'cfg(unix)'.dependencies]
# macOS (via macFUSE) and Linux.
fuser = { version = "0.14.0", optional = true }

[target.'cfg(windows)'.dependencies]
# WinFsp Rust bindings. The adapter maps the same Store behind WinFsp's
# FileSystemContext, mirroring the fuser adapter.
# NOTE: winfsp links via MSVC delay-load and requires the MSVC toolchain
# (x86_64-pc-windows-msvc) + Visual Studio Build Tools; it will not build under
# the GNU toolchain.
winfsp = { version = "0.11.0", optional = true }
winfsp-sys = { version = "0.2", optional = true }
widestring = "1.1.0"

[[bench]]
name = "crypto_bench"
harness = false
